[project]
name = "oya-inai-db"
version = "1.0.0"
description = "親亡き後支援データベース - Neo4j + Next.js + FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mcp[cli]>=1.24.0",
    "neo4j>=6.0.3",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.12.5",
    "pykakasi>=2.3.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.1",
    "reportlab>=4.4.9",
    "streamlit>=1.33.0",
    "uvicorn>=0.32.0",
    "weasyprint>=67.0",
]

[tool.uv.workspace]
members = [
    "api",
]
